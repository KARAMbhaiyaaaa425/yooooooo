{% extends "admin/layout.html" %}

{% block content %}
<div class="p-6 max-w-3xl mx-auto mt-6">
    <div class="flex items-center gap-4 mb-8">
        <a href="/admin/panel" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left text-xl"></i></a>
        <h2 class="text-2xl font-bold text-white">Reorder Store</h2>
    </div>

    <div class="bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-700">
        <p class="text-gray-400 text-sm mb-4">Drag and drop products to change their order in the store.</p>
        
        <form method="POST">
            <ul id="sortable-list" class="space-y-2 mb-6">
                {% for p in products %}
                <li class="bg-gray-900 border border-gray-700 p-3 rounded-lg flex items-center justify-between cursor-move hover:border-blue-500 transition">
                    <div class="flex items-center gap-4">
                        <i class="fa-solid fa-grip-vertical text-gray-500"></i>
                        <span class="text-blue-400 font-bold text-xs uppercase">{{ p.category }}</span>
                        <span class="text-white font-bold">{{ p.name }}</span>
                        <span class="text-gray-400 text-sm">{{ p.plan_name }}</span>
                    </div>
                    <input type="hidden" name="{{ p.id }}" class="order-input" value="{{ loop.index }}">
                </li>
                {% endfor %}
            </ul>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex justify-center items-center gap-2">
                <i class="fa-solid fa-save"></i> Save Order
            </button>
        </form>
    </div>
</div>

<script>
    var el = document.getElementById('sortable-list');
    var sortable = Sortable.create(el, {
        animation: 150,
        onEnd: function (evt) {
            // Update hidden inputs with new index
            var inputs = document.getElementsByClassName('order-input');
            for (var i = 0; i < inputs.length; i++) {
                inputs[i].value = i + 1;
            }
        }
    });
</script>
{% endblock %}
