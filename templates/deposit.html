{% extends "layout.html" %}

{% block content %}
<div class="mb-6">
    <h2 class="text-2xl font-bold text-white">Add Funds</h2>
    <p class="text-gray-400 text-sm">Deposit balance via UPI</p>
</div>

{% if error %}
<div class="bg-red-500/20 text-red-400 border border-red-500 p-4 rounded-lg mb-6 shadow-md">
    <i class="fa-solid fa-triangle-exclamation mr-2"></i> {{ error }}
</div>
{% endif %}

<div class="bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-700 relative overflow-hidden">
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-green-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10"></div>
    <form method="POST">
        <div class="mb-4">
            <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Amount (₹)</label>
            <input type="number" name="amount" min="1" placeholder="Enter amount (Min ₹1)" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition">
        </div>

        <div class="mb-6">
            <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Payment Gateway</label>
            <select name="gateway" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition">
                <option value="1">PhonePe / Paytm (Gateway 1)</option>
                <option value="2">GooglePay / AmazonPay (Gateway 2)</option>
            </select>
            <p class="text-xs text-gray-500 mt-2">If one gateway fails, try the other.</p>
        </div>
        
        <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-green-900/30 transition flex justify-center items-center gap-2 active:scale-95">
            <i class="fa-solid fa-qrcode"></i> Generate QR Code
        </button>
    </form>
</div>
{% endblock %}
