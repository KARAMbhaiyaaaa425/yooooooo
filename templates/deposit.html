{% extends "layout.html" %}

{% block content %}
<div class="mb-6 flex items-center gap-3">
    <a href="/dashboard" class="text-white hover:text-gray-300"><i class="fa-solid fa-chevron-left"></i></a>
    <h2 class="text-lg font-bold text-white">Add Balance</h2>
</div>

<form action="/deposit" method="POST">
    <div class="bg-card border border-gray-800 rounded-2xl p-5 mb-6">
        <label class="block text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-2">Enter Amount</label>
        
        <!-- Quick Select Buttons -->
        <div class="flex gap-2 mb-4">
            <button type="button" onclick="document.getElementById('amt').value='100'" class="flex-1 bg-gray-800 text-gray-400 border border-gray-700 hover:text-white rounded-lg py-2 text-xs font-bold transition">₹100</button>
            <button type="button" onclick="document.getElementById('amt').value='250'" class="flex-1 bg-gray-800 text-gray-400 border border-gray-700 hover:text-white rounded-lg py-2 text-xs font-bold transition">₹250</button>
            <button type="button" onclick="document.getElementById('amt').value='500'" class="flex-1 bg-blue-600 text-white border border-blue-500 rounded-lg py-2 text-xs font-bold shadow-[0_0_10px_rgba(37,99,235,0.4)]">₹500</button>
            <button type="button" onclick="document.getElementById('amt').value='1000'" class="flex-1 bg-gray-800 text-gray-400 border border-gray-700 hover:text-white rounded-lg py-2 text-xs font-bold transition">₹1000</button>
        </div>

        <div class="relative mb-6">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <span class="text-gray-400 text-lg font-bold">₹</span>
            </div>
            <input type="number" name="amount" id="amt" min="10" required class="block w-full pl-10 pr-3 py-4 bg-gray-900 border border-gray-700 rounded-xl text-white font-bold text-lg focus:outline-none focus:border-blue-500 transition" placeholder="500">
        </div>

        <label class="block text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-3">Select Payment Method</label>
        
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-blue-600/10 border border-blue-500 rounded-xl p-3 flex items-center gap-3 cursor-pointer">
                <div class="w-8 h-8 rounded-full bg-blue-900/50 flex items-center justify-center text-blue-400">
                    <i class="fa-brands fa-google-pay"></i>
                </div>
                <span class="text-sm font-bold text-white">UPI / GPay</span>
            </div>
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-3 flex items-center gap-3 cursor-pointer opacity-50">
                <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-gray-400">
                    <i class="fa-solid fa-credit-card"></i>
                </div>
                <span class="text-sm font-bold text-gray-400">Card (Soon)</span>
            </div>
        </div>

        <label class="block text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-2">Note (Optional)</label>
        <input type="text" placeholder="Write a note..." class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 mb-6">

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.4)] transition">
            Proceed to Pay
        </button>
        <p class="text-center text-[10px] text-gray-500 mt-3 flex items-center justify-center gap-1">
            <i class="fa-solid fa-lock text-yellow-500"></i> Your payment is securely processed.
        </p>
    </div>
</form>
{% endblock %}
