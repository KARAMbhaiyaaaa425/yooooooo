{% extends "layout.html" %}

{% block content %}
<div class="mb-6">
    <h2 class="text-2xl font-bold text-white">Order History</h2>
    <p class="text-gray-400 text-sm">Your past purchases</p>
</div>

{% if not orders %}
<div class="text-center py-10 bg-gray-800 rounded-2xl border border-gray-700">
    <i class="fa-solid fa-box-open text-4xl text-gray-600 mb-3"></i>
    <p class="text-gray-400">No orders yet.</p>
</div>
{% else %}
<div class="space-y-4">
    {% for o in orders %}
    <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
        <div class="flex justify-between items-start mb-2">
            <span class="font-bold text-white">{{ o.product }}</span>
            <span class="text-sm font-bold text-green-400">₹{{ o.price }}</span>
        </div>
        <p class="text-xs text-gray-500 mb-3">{{ o.date }} • {{ o.plan }}</p>
        
        <div class="bg-gray-900 border border-gray-700 rounded-lg p-2 flex justify-between items-center">
            <code class="text-blue-400 text-xs truncate max-w-[80%]">{{ o.license_key }}</code>
            <button onclick="navigator.clipboard.writeText('{{ o.license_key }}'); Swal.fire({toast:true, position:'top-end', title:'Copied!', icon:'success', showConfirmButton:false, timer:1500, background:'#1f2937', color:'#fff'});" class="text-gray-400 hover:text-white p-1">
                <i class="fa-regular fa-copy"></i>
            </button>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
{% endblock %}
