{% extends "layout.html" %}

{% block content %}
<div class="mb-6 text-center">
    <h2 class="text-2xl font-bold text-white mb-2">Scan to Pay</h2>
    <p class="text-gray-400 text-sm">Pay exactly <b class="text-green-400 text-lg">₹{{ amount }}</b></p>
</div>

<div class="bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-700 text-center mb-6">
    <div class="bg-white p-4 rounded-xl inline-block mb-4">
        <!-- Render QR code using Google Chart API or raw URL -->
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data={{ upi_url | urlencode }}" alt="UPI QR Code" class="w-48 h-48">
    </div>
    
    <p class="text-xs text-gray-500 mb-2">Order ID: <code class="text-blue-400">{{ order_id }}</code></p>
    
    <div class="mt-4 flex gap-2 justify-center">
        <a href="{{ payment_url }}" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-lg shadow-lg flex items-center gap-2">
            <i class="fa-solid fa-link"></i> Pay Now (Link)
        </a>
    </div>
</div>

<div class="text-center" id="status-container">
    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500 mb-3"></i>
    <p class="text-gray-300 font-bold" id="status-text">Waiting for payment...</p>
    <p class="text-xs text-gray-500 mt-1">Please do not close this page.</p>
</div>

<script>
    let checkInterval = setInterval(() => {
        fetch('/check_payment/{{ order_id }}')
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                clearInterval(checkInterval);
                document.getElementById('status-container').innerHTML = `
                    <i class="fa-solid fa-check-circle text-5xl text-green-500 mb-3"></i>
                    <p class="text-xl font-bold text-white mb-1">Payment Successful!</p>
                    <p class="text-sm text-gray-400 mb-4">₹{{ amount }} has been added to your wallet.</p>
                    <a href="/store" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold">Go to Store</a>
                `;
            }
        });
    }, 5000); // Check every 5 seconds
</script>
{% endblock %}
