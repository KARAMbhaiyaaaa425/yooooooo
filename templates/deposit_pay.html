{% extends "layout.html" %}

{% block content %}
<div class="mb-6 text-center">
    <h2 class="text-2xl font-bold text-white mb-2">Scan to Pay</h2>
    <p class="text-gray-400 text-sm">Pay exactly <b class="text-green-400 text-lg">&#8377;{{ amount }}</b></p>
</div>

<div class="bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-700 text-center mb-6">

    <!-- QR Code directly from FamGateway -->
    <div class="bg-white p-4 rounded-xl inline-block mb-4 shadow-lg">
        <img src="{{ qr_url }}" alt="UPI QR Code" class="w-52 h-52" id="qr-img">
    </div>

    <p class="text-gray-400 text-sm mb-1">Scan with any UPI app (GPay, PhonePe, Paytm)</p>
    <p class="text-xs text-gray-600 mb-3">Order ID: <code class="text-blue-400">{{ order_id }}</code></p>

    <!-- Fallback: Open Gateway button -->
    <a href="{{ checkout_url }}" target="_blank"
        class="inline-flex items-center gap-2 bg-blue-700/40 hover:bg-blue-700/60 border border-blue-700/50 text-blue-300 text-xs font-semibold px-4 py-2 rounded-xl transition">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> Can't scan? Open payment page
    </a>
</div>

<!-- Status container -->
<div class="text-center mt-4" id="status-container">
    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500 mb-3"></i>
    <p class="text-gray-300 font-bold" id="status-text">Waiting for payment...</p>
    <p class="text-xs text-gray-500 mt-1 mb-6">Please do not close this page.</p>

    <a href="/deposit" class="inline-flex items-center gap-2 bg-transparent border border-red-900/50 hover:bg-red-900/20 text-red-500 font-bold text-sm px-6 py-2.5 rounded-xl transition shadow-sm">
        <i class="fa-solid fa-xmark"></i> Cancel Payment
    </a>
</div>

<script>
    let checkInterval = setInterval(() => {
        fetch('/check_payment/{{ order_id }}')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    clearInterval(checkInterval);
                    document.getElementById('status-container').innerHTML = `
                        <i class="fa-solid fa-check-circle text-5xl text-green-500 mb-3"></i>
                        <p class="text-xl font-bold text-white mb-1">Payment Successful!</p>
                        <p class="text-sm text-gray-400 mb-4">&#8377;{{ amount }} has been added to your wallet.</p>
                        <a href="/store" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold">Go to Store</a>
                    `;
                }
            });
    }, 4000);
</script>
{% endblock %}
