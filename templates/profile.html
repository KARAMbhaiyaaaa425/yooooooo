{% extends "layout.html" %}

{% block content %}
<div class="mb-6">
    <h2 class="text-2xl font-bold text-white">My Profile</h2>
</div>

<div class="bg-gradient-to-br from-blue-900 to-gray-800 rounded-2xl p-6 mb-6 shadow-lg border border-blue-800/30 text-center relative overflow-hidden">
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
    <div class="w-20 h-20 bg-gray-700 rounded-full mx-auto mb-4 flex items-center justify-center border-4 border-gray-800 shadow-inner">
        <i class="fa-solid fa-user text-3xl text-gray-400"></i>
    </div>
    <h3 class="text-2xl font-bold text-white mb-1">@{{ user.username }}</h3>
    <p class="text-gray-400 text-sm mb-4">ID: {{ user.user_id }}</p>
    
    <div class="bg-gray-900/50 rounded-xl p-4 flex justify-around items-center border border-gray-700/50">
        <div>
            <p class="text-xs text-gray-500 uppercase font-bold mb-1">Balance</p>
            <p class="text-2xl font-black text-green-400">₹{{ balance }}</p>
        </div>
        <div class="h-10 w-px bg-gray-700"></div>
        <div>
            <p class="text-xs text-gray-500 uppercase font-bold mb-1">Status</p>
            <p class="text-sm font-bold text-blue-400 mt-1">{% if user.get('is_reseller') %}Reseller{% else %}User{% endif %}</p>
        </div>
    </div>
</div>

<div class="bg-gray-800 rounded-2xl overflow-hidden border border-gray-700">
    <a href="/deposit_history" class="flex items-center justify-between p-4 border-b border-gray-700 hover:bg-gray-750 transition active:bg-gray-700">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-blue-900/30 flex items-center justify-center text-blue-400">
                <i class="fa-solid fa-money-bill-transfer"></i>
            </div>
            <span class="font-medium text-white">Deposit History</span>
        </div>
        <i class="fa-solid fa-chevron-right text-gray-500"></i>
    </a>
    
    <a href="/logout" class="flex items-center justify-between p-4 hover:bg-gray-750 transition active:bg-gray-700">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-red-900/30 flex items-center justify-center text-red-400">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </div>
            <span class="font-medium text-red-400">Logout</span>
        </div>
        <i class="fa-solid fa-chevron-right text-gray-500"></i>
    </a>
</div>
{% endblock %}
