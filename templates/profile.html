{% extends "layout.html" %}

{% block content %}
<div class="mb-6 flex items-center gap-3">
    <a href="/dashboard" class="text-white hover:text-gray-300"><i class="fa-solid fa-chevron-left"></i></a>
    <h2 class="text-lg font-bold text-white">My Profile</h2>
</div>

<div class="bg-card border border-gray-800 rounded-2xl p-6 mb-6 text-center">
    <div class="w-24 h-24 rounded-full bg-blue-900/30 border-4 border-blue-600 mx-auto mb-4 flex items-center justify-center text-blue-500 text-4xl shadow-[0_0_15px_rgba(37,99,235,0.4)]">
        <i class="fa-solid fa-user"></i>
    </div>
    <h3 class="text-xl font-bold text-white mb-1">{{ user.username | default('User') }}</h3>
    <p class="text-xs text-gray-400 mb-4">User ID: {{ user.user_id }}</p>
    
    <div class="inline-flex items-center gap-2 bg-green-500/10 border border-green-500/20 px-4 py-2 rounded-full">
        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
        <span class="text-xs font-bold text-green-400 uppercase tracking-widest">Active Member</span>
    </div>
</div>

<div class="space-y-3 mb-16">
    <div class="bg-card border border-gray-800 rounded-xl p-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-gray-800 flex items-center justify-center text-gray-400"><i class="fa-solid fa-wallet"></i></div>
            <div>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Wallet Balance</p>
                <p class="text-white font-bold">₹{{ user.balance | default(0) }}</p>
            </div>
        </div>
        <a href="/deposit" class="bg-blue-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg shadow-md hover:bg-blue-500 transition">Add</a>
    </div>

    <a href="/history" class="block bg-card border border-gray-800 rounded-xl p-4 flex justify-between items-center hover:bg-gray-800/50 transition">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-gray-800 flex items-center justify-center text-gray-400"><i class="fa-solid fa-key"></i></div>
            <p class="text-sm font-bold text-white">My Purchased Keys</p>
        </div>
        <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>
    </a>

    <a href="/deposit_history" class="block bg-card border border-gray-800 rounded-xl p-4 flex justify-between items-center hover:bg-gray-800/50 transition">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-gray-800 flex items-center justify-center text-gray-400"><i class="fa-solid fa-clock-rotate-left"></i></div>
            <p class="text-sm font-bold text-white">Deposit History</p>
        </div>
        <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>
    </a>
</div>
{% endblock %}
