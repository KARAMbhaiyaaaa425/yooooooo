<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Karan Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-900 text-gray-200">
    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-white tracking-wider">KARAN <span class="text-blue-500">STORE</span></h1>
            <a href="/logout" class="text-sm bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded-lg text-white font-medium transition">Logout</a>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto p-4 pb-20">
        <!-- Profile Card -->
        <div class="bg-gradient-to-r from-blue-900 to-gray-800 rounded-2xl p-6 mb-6 shadow-lg border border-blue-800/30 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
            <p class="text-gray-300 text-sm font-medium mb-1">Welcome back,</p>
            <h2 class="text-2xl font-bold text-white mb-4">@{{ session['username'] }}</h2>
            <div class="bg-black/30 rounded-xl p-4 flex justify-between items-center backdrop-blur-sm">
                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold mb-1">Wallet Balance</p>
                    <p class="text-3xl font-bold text-green-400">₹{{ balance }}</p>
                </div>
                <button class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded-xl text-sm shadow-lg shadow-green-900/20 transition" onclick="Swal.fire('Add Balance', 'Go to Telegram bot to add balance automatically via UPI!', 'info')">
                    + ADD
                </button>
            </div>
        </div>

        <h3 class="text-lg font-bold text-white mb-4 px-1 border-l-4 border-blue-500 pl-3">Available Products</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {% for p in products %}
            <div class="bg-gray-800 rounded-2xl p-5 border border-gray-700 shadow-md hover:border-blue-500/50 transition">
                <div class="flex justify-between items-start mb-3">
                    <span class="text-xs font-bold px-2.5 py-1 bg-gray-700 text-blue-400 rounded-full">{{ p.category }}</span>
                    <span class="text-xl font-bold text-green-400">₹{{ p.price }}</span>
                </div>
                <h4 class="text-xl font-bold text-white mb-1">{{ p.name }}</h4>
                <p class="text-gray-400 text-sm mb-4"><span class="inline-block mr-1">⏳</span>{{ p.plan_name }} Plan</p>
                
                <button onclick="buyProduct({{ p.id }}, '{{ p.name }}', {{ p.price }})" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-900/20 transition flex justify-center items-center gap-2">
                    <span>Purchase Key</span>
                </button>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function buyProduct(productId, name, price) {
            Swal.fire({
                title: 'Confirm Purchase',
                text: `Buy ${name} for ₹${price}?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#2563eb',
                cancelButtonColor: '#4b5563',
                confirmButtonText: 'Yes, Buy it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: 'Generating Key...',
                        text: 'Please wait, connecting to server.',
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading() }
                    });

                    let formData = new FormData();
                    formData.append('product_id', productId);

                    fetch('/buy', { method: 'POST', body: formData })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            Swal.fire({
                                title: 'Success!',
                                html: `Your License Key:<br><br><code class="bg-gray-200 text-black p-2 rounded text-lg font-bold select-all">${data.key}</code>`,
                                icon: 'success',
                                confirmButtonText: 'Copy & Close'
                            }).then(() => {
                                navigator.clipboard.writeText(data.key);
                                location.reload();
                            });
                        } else {
                            Swal.fire('Failed!', data.msg, 'error');
                        }
                    })
                    .catch(() => Swal.fire('Error', 'Network Error', 'error'));
                }
            });
        }
    </script>
</body>
</html>
