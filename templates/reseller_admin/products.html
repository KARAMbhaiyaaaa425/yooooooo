{% extends "reseller_admin/layout.html" %}

{% block content %}
<div class="mb-6 flex justify-between items-center">
    <div>
        <h2 class="text-2xl font-bold text-white">Pricing Configuration</h2>
        <p class="text-sm text-gray-400 mt-1">Set the profit markup for your store</p>
    </div>
</div>

<div class="bg-[#111827] rounded-2xl border border-gray-800 overflow-hidden shadow-lg mb-8">
    <table class="w-full text-left text-sm text-gray-300">
        <thead class="bg-gray-900 border-b border-gray-800">
            <tr>
                <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase">Product Name</th>
                <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase">Your Cost</th>
                <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase">Selling Price</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-800">
            {% for p in products %}
            <tr class="hover:bg-gray-800/50 transition">
                <td class="px-6 py-4">
                    <p class="font-bold text-white">{{ p.name }}</p>
                    <p class="text-xs text-gray-500">{{ p.category }} - {{ p.plan_name }}</p>
                </td>
                <td class="px-6 py-4 font-mono text-red-400 font-bold">?{{ p.price }}</td>
                <td class="px-6 py-4">
                    <form method="POST" action="/my_store/products" class="flex gap-2">
                        <input type="hidden" name="pid" value="{{ p.id }}">
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">?</span>
                            <input type="number" step="0.01" name="reseller_price" value="{{ p.reseller_price }}" class="w-32 bg-[#0a0e17] border border-gray-700 text-green-400 font-bold px-4 pl-7 py-2 rounded-lg focus:border-purple-500 outline-none transition">
                        </div>
                        <button type="submit" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg font-bold transition shadow text-xs">SAVE</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
