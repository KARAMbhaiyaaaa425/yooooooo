{% extends "layout.html" %}

{% block content %}
<div class="mb-4">
    <h2 class="text-2xl font-bold text-white">Product Store</h2>
    <p class="text-gray-400 text-sm">Purchase keys instantly 24/7</p>
</div>

<div class="space-y-4">
    {% for p in products %}
    <div class="bg-gray-800 rounded-2xl p-5 border border-gray-700 shadow-md">
        <div class="flex justify-between items-start mb-2">
            <span class="text-[10px] font-bold px-2 py-1 bg-gray-700/50 text-blue-400 rounded-md tracking-wider uppercase">{{ p.category }}</span>
            <span class="text-lg font-bold text-green-400">₹{{ p.price }}</span>
        </div>
        <h4 class="text-lg font-bold text-white mb-1">{{ p.name }}</h4>
        <p class="text-gray-400 text-sm mb-4"><i class="fa-regular fa-clock mr-1"></i> {{ p.plan_name }}</p>
        
        <button onclick="buyProduct({{ p.id }}, '{{ p.name }}', {{ p.price }})" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-900/20 transition flex justify-center items-center gap-2 active:scale-[0.98]">
            <i class="fa-solid fa-cart-shopping"></i> Purchase Key
        </button>
    </div>
    {% endfor %}
</div>

<script>
function buyProduct(productId, name, price) {
    Swal.fire({
        title: 'Confirm Purchase',
        html: `<p class="text-gray-300">Buy <b>${name}</b> for <b class="text-green-400">₹${price}</b>?</p>`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#2563eb',
        cancelButtonColor: '#374151',
        confirmButtonText: 'Buy Now',
        background: '#1f2937',
        color: '#fff'
    }).then((result) => {
        if (result.isConfirmed) {
            Swal.fire({
                title: 'Generating Key...',
                text: 'Please wait...',
                allowOutsideClick: false,
                background: '#1f2937', color: '#fff',
                didOpen: () => { Swal.showLoading() }
            });

            let formData = new FormData();
            formData.append('product_id', productId);

            fetch('/buy', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    Swal.fire({
                        title: 'Success!',
                        html: `<p class="text-gray-400 mb-2">Your License Key:</p>
                               <div class="bg-gray-900 text-green-400 p-3 rounded-lg border border-gray-700 text-lg font-mono font-bold select-all break-all">${data.key}</div>`,
                        icon: 'success',
                        confirmButtonText: 'Copy & Close',
                        background: '#1f2937', color: '#fff'
                    }).then(() => {
                        navigator.clipboard.writeText(data.key);
                        location.reload();
                    });
                } else {
                    Swal.fire({title: 'Failed', text: data.msg, icon: 'error', background: '#1f2937', color: '#fff'});
                }
            });
        }
    });
}
</script>
{% endblock %}
