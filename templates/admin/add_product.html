<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-200">
    <div class="p-6 max-w-2xl mx-auto mt-10">
        <div class="flex items-center gap-4 mb-8">
            <a href="/admin/products" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left text-xl"></i></a>
            <h2 class="text-2xl font-bold text-white">Add New Product (API)</h2>
        </div>

        <div class="bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-700">
            <form method="POST">
                <div class="grid grid-cols-2 gap-4">
                    <div class="mb-4">
                        <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Category Name</label>
                        <input type="text" name="category" placeholder="e.g. FREEFIRE" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Product Title</label>
                        <input type="text" name="name" placeholder="e.g. BALA MOD XYZ" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div class="mb-4">
                        <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Plan Name</label>
                        <input type="text" name="plan_name" placeholder="e.g. 1 Hours" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Price (₹)</label>
                        <input type="number" step="0.01" name="price" placeholder="10.00" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">API ID</label>
                        <input type="number" name="product_id" placeholder="e.g. 153" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Image or Video URL</label>
                    <input type="url" name="media_url" placeholder="https://example.com/video.mp4" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Features (One per line)</label>
                    <textarea name="features" rows="4" placeholder="✅ NON ROOT&#10;✅ Aimbot" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"></textarea>
                </div>
                
                <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-green-900/30 transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add Product to Store
                </button>
            </form>
        </div>
    </div>
</body>
</html>
