{% extends "admin/layout.html" %}

{% block content %}
<div class="max-w-xl mx-auto mt-6 mb-20">
    <div class="flex items-center gap-4 mb-8">
        <a href="/admin/products" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left text-xl"></i></a>
        <h2 class="text-2xl font-bold text-white">Edit Product</h2>
    </div>

    <div class="bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-700">
        <form method="POST">
            <h4 class="text-lg font-bold text-blue-400 mb-4 border-b border-gray-700 pb-2">Basic Info</h4>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Category</label>
                    <input type="text" name="category" value="{{ product.category }}" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Product Name</label>
                    <input type="text" name="name" value="{{ product.name }}" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Plan/Duration</label>
                    <input type="text" name="plan_name" value="{{ product.plan_name }}" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Price (?)</label>
                    <input type="number" step="0.01" name="price" value="{{ product.price }}" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">API / Prod ID</label>
                    <input type="text" name="product_id" value="{{ product.product_id }}" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <h4 class="text-lg font-bold text-green-400 mb-4 border-b border-gray-700 pb-2 mt-6">Design & Features</h4>

                        <div class="mb-4">
                <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Image or Video URL</label>
                <input type="url" name="media_url" value="{{ product.media_url | default('') }}" placeholder="https://example.com/video.mp4" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500">
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Check File Feedback Link</label>
                    <input type="url" name="feedback_link" value="{{ product.feedback_link | default('') }}" placeholder="https://t.me/..." class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Check File Updates Link</label>
                    <input type="url" name="updates_link" value="{{ product.updates_link | default('') }}" placeholder="https://t.me/..." class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="mb-4">
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Status</label>
                    <select name="status" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500">
                        <option value="SAFE" class="text-green-500" {% if product.status == 'SAFE' or product.status == 'WORKING' %}selected{% endif %}>?? WORKING</option>
                        <option value="UPDATING" class="text-yellow-500" {% if product.status == 'UPDATING' %}selected{% endif %}>?? UPDATING</option>
                        <option value="PATCHED" class="text-red-500" {% if product.status == 'PATCHED' %}selected{% endif %}>?? PATCHED</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Status Message</label>
                    <input type="text" name="status_msg" value="{{ product.status_msg | default('') }}" placeholder="Bhai ye product patch ho gaya hai..." class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Features (One per line)</label>
                <textarea name="features" rows="5" placeholder="?? NON ROOT
?? Aimbot
?? ESP" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500">{{ product.features | default('') }}</textarea>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex justify-center items-center gap-2">
                <i class="fa-solid fa-save"></i> Save All Changes
            </button>
        </form>
    </div>
</div>
{% endblock %}
