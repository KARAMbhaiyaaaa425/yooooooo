<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-200">
    <div class="p-6 max-w-xl mx-auto mt-10">
        <div class="flex items-center gap-4 mb-8">
            <a href="/admin/products" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left text-xl"></i></a>
            <h2 class="text-2xl font-bold text-white">Edit Product Design</h2>
        </div>

        <div class="bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-700">
            <h3 class="text-xl font-bold text-blue-400 mb-4">{{ product.name }} <span class="text-gray-400 text-sm">({{ product.plan_name }})</span></h3>
            
            <form method="POST">
                <div class="mb-4">
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Image or Video URL</label>
                    <input type="url" name="media_url" value="{{ product.media_url | default('') }}" placeholder="https://example.com/video.mp4" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                    <p class="text-xs text-gray-500 mt-2">Paste a direct link to an image (.jpg/.png) or video (.mp4). This will show at the top of the product card.</p>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Features (One per line)</label>
                    <textarea name="features" rows="5" placeholder="✅ NON ROOT&#10;✅ Aimbot&#10;✅ ESP" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">{{ product.features | default('') }}</textarea>
                    <p class="text-xs text-gray-500 mt-2">These will appear as bullet points on the product card.</p>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-900/30 transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-save"></i> Save Changes
                </button>
            </form>
        </div>
    </div>
</body>
</html>
