<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-200">
    <div class="p-6 max-w-4xl mx-auto mt-10">
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-4">
                <a href="/admin/panel" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left text-xl"></i></a>
                <h2 class="text-2xl font-bold text-white">Current Products</h2>
            </div>
            <a href="/admin/product/add" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg font-bold shadow-md transition">
                + Add Product
            </a>
        </div>

        <div class="bg-gray-800 rounded-xl overflow-hidden border border-gray-700">
            <table class="min-w-full divide-y divide-gray-700">
                <thead class="bg-gray-900">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Category</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Plan</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Price</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">API ID</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                    {% for p in products %}
                    <tr class="hover:bg-gray-750">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-blue-400">{{ p.category }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-white">{{ p.name }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">{{ p.plan_name }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-green-400">₹{{ p.price }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ p.product_id }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <a href="/admin/product/edit/{{ p.id }}" class="text-blue-400 hover:text-blue-300 mr-3"><i class="fa-solid fa-pen-to-square"></i></a>
                            <a href="/admin/product/delete/{{ p.id }}" onclick="return confirm('Are you sure you want to delete this product?');" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        
    </div>
</body>
</html>
