{% extends "admin/layout.html" %}

{% block content %}
<div class="p-6 max-w-4xl mx-auto mt-6">
    <div class="flex items-center gap-4 mb-8">
        <a href="/admin/panel" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left text-xl"></i></a>
        <h2 class="text-2xl font-bold text-white">Push Notifications</h2>
    </div>

    <!-- Send Notification Form -->
    <div class="bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-700 mb-8">
        <h3 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-paper-plane mr-2 text-blue-400"></i> Send New Notification</h3>
        <form method="POST">
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Notification Title</label>
                <input type="text" name="title" required placeholder="e.g. Server Maintenance" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:border-blue-500">
            </div>
            <div class="mb-6">
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Message</label>
                <textarea name="message" required rows="3" placeholder="Enter message..." class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:border-blue-500"></textarea>
            </div>
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition flex justify-center items-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Send to All Users
            </button>
        </form>
    </div>

    <!-- History -->
    <h3 class="text-lg font-bold text-white mb-4">Past Notifications</h3>
    <div class="space-y-4">
        {% for n in notifications %}
        <div class="bg-gray-900 border border-gray-700 rounded-xl p-4">
            <div class="flex justify-between items-start mb-2">
                <h4 class="font-bold text-white">{{ n.title }}</h4>
                <span class="text-xs text-gray-500">{{ n.date }}</span>
            </div>
            <p class="text-sm text-gray-400">{{ n.message }}</p>
        </div>
        {% else %}
        <p class="text-gray-500 text-sm">No notifications sent yet.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
