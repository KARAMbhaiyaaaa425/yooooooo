{% extends "layout.html" %}

{% block content %}
<div class="mb-8 mt-2 flex items-center gap-4">
    <a href="/settings" class="text-gray-300 hover:text-white text-xl"><i class="fa-solid fa-arrow-left"></i></a>
    <h2 class="text-2xl font-bold text-gray-200 tracking-wide uppercase">Appearance</h2>
</div>

<div class="space-y-8 mb-20 px-2">
    
    <!-- Theme Selection -->
    <div>
        <p class="text-[13px] text-blue-400 font-bold mb-4 uppercase tracking-widest theme-text">Theme Mode</p>
        <div class="flex border border-gray-700 rounded-full overflow-hidden">
            <button onclick="setMode('system')" id="mode-system" class="mode-btn flex-1 py-2 text-xs font-bold uppercase bg-blue-600 text-white flex items-center justify-center gap-2 theme-bg">
                <i class="fa-solid fa-check"></i> System
            </button>
            <button onclick="setMode('light')" id="mode-light" class="mode-btn flex-1 py-2 text-xs font-bold uppercase bg-transparent text-gray-400 border-l border-gray-700 hover:bg-gray-800 transition">Light</button>
            <button onclick="setMode('dark')" id="mode-dark" class="mode-btn flex-1 py-2 text-xs font-bold uppercase bg-transparent text-gray-400 border-l border-gray-700 hover:bg-gray-800 transition">Dark</button>
        </div>
    </div>

    <!-- Color Schemes -->
    <div data-ignore-theme="true">
        <p class="text-[13px] text-blue-400 font-bold mb-4 uppercase tracking-widest theme-text">Color Scheme</p>
        <div class="flex gap-4 overflow-x-auto pb-4 scrollbar-hide">
            
            <!-- Default -->
            <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer" onclick="setAccent('default')">
                <div id="card-default" class="w-24 h-40 rounded-2xl border-2 border-blue-400 bg-[#1c1c24] relative p-3 flex flex-col justify-between theme-border">
                    <div class="w-12 h-4 bg-gray-200 rounded-full"></div>
                    <div id="check-default" class="absolute top-2 right-2 w-5 h-5 bg-blue-400 rounded-full flex items-center justify-center text-white text-[10px] theme-bg">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div class="w-10 h-14 bg-gray-600 rounded-lg relative mt-2">
                        <div class="absolute top-1 left-1 w-3 h-3 bg-green-400 rounded-full"></div>
                        <div class="absolute top-1 left-4 w-3 h-3 bg-blue-400 rounded-full"></div>
                    </div>
                    <div class="flex gap-2 w-full mt-auto">
                        <div class="w-4 h-4 bg-blue-400 rounded-full theme-bg"></div>
                        <div class="w-10 h-4 bg-gray-500 rounded-full"></div>
                    </div>
                </div>
                <span class="text-xs font-bold text-gray-300 uppercase tracking-widest">Default</span>
            </div>

            <!-- Monet -->
            <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer" onclick="setAccent('monet')">
                <div id="card-monet" class="w-24 h-40 rounded-2xl border-2 border-gray-600 bg-[#151515] relative p-3 flex flex-col justify-between opacity-80 transition hover:opacity-100">
                    <div class="w-12 h-4 bg-gray-200 rounded-full"></div>
                    <div id="check-monet" class="absolute top-2 right-2 w-5 h-5 bg-teal-400 rounded-full flex items-center justify-center text-white text-[10px] hidden">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div class="w-10 h-14 bg-gray-600 rounded-lg relative mt-2">
                        <div class="absolute top-1 left-1 w-3 h-3 bg-teal-300 rounded-full"></div>
                        <div class="absolute top-1 left-4 w-3 h-3 bg-gray-400 rounded-full"></div>
                    </div>
                    <div class="flex gap-2 w-full mt-auto">
                        <div class="w-4 h-4 bg-teal-400 rounded-full"></div>
                        <div class="w-10 h-4 bg-gray-500 rounded-full"></div>
                    </div>
                </div>
                <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">Monet</span>
            </div>

            <!-- Green apple -->
            <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer" onclick="setAccent('greenapple')">
                <div id="card-greenapple" class="w-24 h-40 rounded-2xl border-2 border-gray-600 bg-[#0f1411] relative p-3 flex flex-col justify-between opacity-80 transition hover:opacity-100">
                    <div class="w-12 h-4 bg-gray-200 rounded-full"></div>
                    <div id="check-greenapple" class="absolute top-2 right-2 w-5 h-5 bg-green-500 rounded-full flex items-center justify-center text-white text-[10px] hidden">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div class="w-10 h-14 bg-[#2c332e] rounded-lg relative mt-2">
                        <div class="absolute top-1 left-1 w-3 h-3 bg-red-400 rounded-full"></div>
                        <div class="absolute top-1 left-4 w-3 h-3 bg-green-500 rounded-full"></div>
                    </div>
                    <div class="flex gap-2 w-full mt-auto">
                        <div class="w-4 h-4 bg-green-500 rounded-full"></div>
                        <div class="w-10 h-4 bg-gray-500 rounded-full"></div>
                    </div>
                </div>
                <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">Green Apple</span>
            </div>
        </div>
    </div>

    <!-- Toggle -->
    <div class="flex justify-between items-center pt-4">
        <span class="text-[12px] font-bold uppercase tracking-widest text-gray-200">Pure black dark mode</span>
        <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="blackModeToggle" class="sr-only peer" onchange="togglePureBlack()">
            <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-gray-300 after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600 theme-peer-checked"></div>
        </label>
    </div>

</div>

<script>
    // ACCENT COLOR LOGIC (Default, Monet, Green Apple)
    const accents = {
        'default': { color: '#2563eb' },
        'monet': { color: '#14b8a6' },
        'greenapple': { color: '#22c55e' }
    };
    
    function setAccent(theme) {
        localStorage.setItem('accentTheme', theme);
        applyAccentTheme(theme);
    }

    function applyAccentTheme(theme) {
        // Reset all UI selections
        ['default', 'monet', 'greenapple'].forEach(t => {
            document.getElementById(`card-${t}`).classList.remove('border-blue-400', 'border-teal-400', 'border-green-500');
            document.getElementById(`card-${t}`).classList.add('border-gray-600');
            document.getElementById(`card-${t}`).classList.add('opacity-80');
            document.getElementById(`check-${t}`).classList.add('hidden');
        });

        // Highlight selected
        const card = document.getElementById(`card-${theme}`);
        const check = document.getElementById(`check-${theme}`);
        card.classList.remove('border-gray-600', 'opacity-80');
        check.classList.remove('hidden');

        let borderClass = 'border-blue-400';
        if (theme === 'monet') borderClass = 'border-teal-400';
        if (theme === 'greenapple') borderClass = 'border-green-500';
        card.classList.add(borderClass);

        // Apply global accent variable (used in layout.html if we want, but for now we'll just reload to apply it globally via JS)
        Swal.fire({
            title: 'THEME APPLIED!',
            text: 'Please wait while we refresh the app to apply the new color scheme.',
            icon: 'success',
            timer: 1500,
            showConfirmButton: false,
            background: '#111827', color: '#fff'
        }).then(() => {
            location.reload();
        });
    }

    // MODE SELECTION LOGIC (System, Light, Dark)
    function setMode(mode) {
        localStorage.setItem('displayMode', mode);
        
        Swal.fire({
            title: 'MODE APPLIED!',
            text: 'Light/Dark mode has been updated.',
            icon: 'success',
            timer: 1000,
            showConfirmButton: false,
            background: '#111827', color: '#fff'
        }).then(() => {
            location.reload();
        });
    }

    // PURE BLACK LOGIC
    const toggle = document.getElementById('blackModeToggle');
    if (localStorage.getItem('pureBlack') === 'true') toggle.checked = true;

    function togglePureBlack() {
        localStorage.setItem('pureBlack', toggle.checked ? 'true' : 'false');
        Swal.fire({
            title: 'BACKGROUND UPDATED!',
            icon: 'success',
            timer: 1000,
            showConfirmButton: false,
            background: '#111827', color: '#fff'
        }).then(() => {
            location.reload();
        });
    }

    // Restore UI states without refreshing
    document.addEventListener("DOMContentLoaded", () => {
        let savedAccent = localStorage.getItem('accentTheme') || 'default';
        ['default', 'monet', 'greenapple'].forEach(t => {
            document.getElementById(`card-${t}`).classList.add('border-gray-600', 'opacity-80');
            document.getElementById(`check-${t}`).classList.add('hidden');
        });
        
        let borderClass = savedAccent === 'monet' ? 'border-teal-400' : (savedAccent === 'greenapple' ? 'border-green-500' : 'border-blue-400');
        document.getElementById(`card-${savedAccent}`).classList.remove('border-gray-600', 'opacity-80');
        document.getElementById(`card-${savedAccent}`).classList.add(borderClass);
        document.getElementById(`check-${savedAccent}`).classList.remove('hidden');

        let savedMode = localStorage.getItem('displayMode') || 'system';
        ['system', 'light', 'dark'].forEach(m => {
            let btn = document.getElementById(`mode-${m}`);
            btn.className = `mode-btn flex-1 py-2 text-xs font-bold uppercase bg-transparent text-gray-400 border-l border-gray-700 hover:bg-gray-800 transition`;
            btn.innerHTML = m.charAt(0).toUpperCase() + m.slice(1);
        });
        
        let activeBtn = document.getElementById(`mode-${savedMode}`);
        // Read global accent color to color the active mode button
        let hex = savedAccent === 'monet' ? '#14b8a6' : (savedAccent === 'greenapple' ? '#22c55e' : '#2563eb');
        activeBtn.className = `mode-btn flex-1 py-2 text-xs font-bold uppercase text-white flex items-center justify-center gap-2`;
        activeBtn.style.backgroundColor = hex;
        activeBtn.innerHTML = `<i class="fa-solid fa-check"></i> ${savedMode.charAt(0).toUpperCase() + savedMode.slice(1)}`;
    });

</script>
{% endblock %}
