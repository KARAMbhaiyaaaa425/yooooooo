{% extends "admin/layout.html" %}

{% block content %}
<div class="p-6 max-w-3xl mx-auto mt-6">
    <div class="flex items-center gap-4 mb-8">
        <a href="/admin/panel" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left text-xl"></i></a>
        <h2 class="text-2xl font-bold text-white">Reorder Store Products</h2>
    </div>

    <div class="bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-700">
        <p class="text-gray-400 text-sm mb-4">Drag and drop products to change their order in the store.</p>
        
        <ul id="sortable-list" class="space-y-3 mb-6">
            {% for group in grouped_products %}
            <li class="bg-gray-900 border border-gray-700 p-4 rounded-xl flex items-center justify-between cursor-move hover:border-blue-500 transition shadow-sm group-item" data-ids="{{ group.ids }}">
                <div class="flex items-center gap-4">
                    <i class="fa-solid fa-grip-vertical text-gray-500 text-lg"></i>
                    <div>
                        <span class="text-blue-400 font-bold text-xs uppercase block mb-1">{{ group.category }}</span>
                        <span class="text-white font-black text-lg tracking-wide">{{ group.name }}</span>
                        <span class="text-gray-500 text-xs ml-2">({{ group.count }} plans)</span>
                    </div>
                </div>
            </li>
            {% endfor %}
        </ul>
        
        <button onclick="saveOrder()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg transition flex justify-center items-center gap-2">
            <i class="fa-solid fa-save text-lg"></i> Save Order
        </button>
    </div>
</div>

<script>
    var el = document.getElementById('sortable-list');
    var sortable = Sortable.create(el, {
        animation: 150,
        ghostClass: 'opacity-50'
    });

    function saveOrder() {
        const items = document.querySelectorAll('.group-item');
        let orderData = [];
        
        let currentOrder = 1;
        items.forEach((item, index) => {
            const idsStr = item.getAttribute('data-ids');
            if(idsStr) {
                const ids = idsStr.split(',').map(id => id.trim());
                ids.forEach(id => {
                    const parsedId = isNaN(parseInt(id)) ? id : parseInt(id);
                    orderData.push({ id: parsedId, order: currentOrder });
                    currentOrder++;
                });
            }
        });

        Swal.fire({
            title: 'Saving...',
            allowOutsideClick: false,
            background: '#111827', color: '#fff',
            didOpen: () => { Swal.showLoading() }
        });

        fetch('/admin/reorder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order: orderData })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                Swal.fire({
                    icon: 'success',
                    title: 'Saved!',
                    text: 'Store order has been updated.',
                    background: '#111827', color: '#fff'
                });
            }
        });
    }
</script>
{% endblock %}
