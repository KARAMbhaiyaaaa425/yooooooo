{% extends "admin/layout.html" %}

{% block content %}
<div class="p-6 max-w-3xl mx-auto mt-6">
    <div class="flex items-center gap-4 mb-6">
        <a href="/admin/support" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left text-xl"></i></a>
        <div>
            <h2 class="text-2xl font-bold text-white">Chat with {{ ticket.username }}</h2>
            <p class="text-xs text-gray-500 font-mono">{{ ticket.user_id }}</p>
        </div>
    </div>

    <div class="bg-gray-800 border border-gray-700 rounded-2xl flex flex-col h-[60vh] shadow-lg relative overflow-hidden">
        <!-- Chat Area -->
        <div class="flex-1 overflow-y-auto p-5 space-y-4" id="chatBox">
            {% for msg in ticket.messages %}
                {% if msg.sender == 'user' %}
                <!-- User Message -->
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-gray-400 shrink-0">
                        <i class="fa-solid fa-user text-xs"></i>
                    </div>
                    <div>
                        <div class="bg-gray-700 border border-gray-600 rounded-2xl rounded-tl-sm px-4 py-2 max-w-[100%]">
                            <p class="text-sm text-white">{{ msg.text }}</p>
                        </div>
                        <p class="text-[9px] text-gray-500 mt-1 ml-1">{{ msg.time }}</p>
                    </div>
                </div>
                {% else %}
                <!-- Admin Message -->
                <div class="flex flex-row-reverse gap-3">
                    <div>
                        <div class="bg-blue-600 rounded-2xl rounded-tr-sm px-4 py-2 max-w-[100%] shadow-[0_0_15px_rgba(37,99,235,0.2)]">
                            <p class="text-sm text-white">{{ msg.text }}</p>
                        </div>
                        <p class="text-[9px] text-gray-500 mt-1 mr-1 text-right">{{ msg.time }}</p>
                    </div>
                </div>
                {% endif %}
            {% endfor %}
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-gray-900 border-t border-gray-700">
            <form method="POST" class="flex gap-2">
                <input type="text" name="message" required placeholder="Type reply to {{ ticket.username }}..." autocomplete="off" class="flex-1 bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition">
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-6 rounded-lg font-bold transition shadow-lg">
                    Send Reply <i class="fa-solid fa-paper-plane ml-2"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    chatBox.scrollTop = chatBox.scrollHeight;
</script>
{% endblock %}
