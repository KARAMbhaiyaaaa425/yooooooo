{% extends "admin/layout.html" %}

{% block content %}
<div class="mb-8 flex items-center gap-4">
    <a href="/admin/panel" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left text-xl"></i></a>
    <h2 class="text-2xl font-bold text-white">All Orders</h2>
</div>

<div class="bg-gray-800 rounded-xl overflow-hidden border border-gray-700">
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-700">
            <thead class="bg-gray-900">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Date</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">User ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Product</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Price</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Key Delivered</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-700">
                {% for o in orders %}
                <tr class="hover:bg-gray-750">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400">{{ o.date | default('N/A') }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-blue-400">{{ o.user_id }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-white">{{ o.product }} <span class="text-xs text-gray-500 font-normal ml-1">({{ o.plan }})</span></td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-green-400">₹{{ o.price }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300 font-mono text-xs max-w-xs truncate">{{ o.license_key }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
