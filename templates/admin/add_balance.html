<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Balance - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-200">
    <div class="p-6 max-w-xl mx-auto mt-10">
        <div class="flex items-center gap-4 mb-8">
            <a href="/admin/panel" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left text-xl"></i></a>
            <h2 class="text-2xl font-bold text-white">Manage User Balance</h2>
        </div>
        
        {% if msg %}
        <div class="bg-green-500/20 text-green-400 border border-green-500 p-4 rounded-lg mb-6 shadow-md">
            <i class="fa-solid fa-check-circle mr-2"></i> {{ msg }}
        </div>
        {% endif %}

        <div class="bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-700">
            <form method="POST">
                <div class="mb-4">
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Target User ID</label>
                    <input type="text" name="user_id" placeholder="Enter User ID" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Amount (₹)</label>
                    <input type="number" name="amount" placeholder="e.g. 500 or -100" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                    <p class="text-xs text-gray-500 mt-2">Use negative numbers (e.g. -50) to remove balance.</p>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-900/30 transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-plus-minus"></i> Update Balance
                </button>
            </form>
        </div>
    </div>
</body>
</html>
