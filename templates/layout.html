<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karan Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        /* Hide scrollbar for neatness */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 pb-20">

    <!-- Header -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-white tracking-widest uppercase">KARAN <span class="text-blue-500">STORE</span></h1>
            <div class="flex items-center gap-3">
                <div class="bg-gray-700 px-3 py-1 rounded-full flex items-center gap-2 border border-gray-600">
                    <i class="fa-solid fa-wallet text-green-400 text-sm"></i>
                    <span class="font-bold text-white text-sm">₹{{ balance }}</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="max-w-md mx-auto p-4 relative">
        {% block content %}{% endblock %}
    </div>

    <!-- Bottom Navigation Bar for Mobile -->
    <div class="fixed bottom-0 w-full bg-gray-800 border-t border-gray-700 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center p-2">
            
            <a href="/store" class="flex flex-col items-center p-2 text-gray-400 hover:text-blue-400 active:text-blue-500 w-16">
                <i class="fa-solid fa-store text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Store</span>
            </a>
            
            <a href="/history" class="flex flex-col items-center p-2 text-gray-400 hover:text-blue-400 active:text-blue-500 w-16">
                <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Orders</span>
            </a>

            <!-- Big Add Balance Button -->
            <div class="relative -top-5">
                <a href="/deposit" class="bg-blue-600 w-14 h-14 rounded-full flex items-center justify-center border-4 border-gray-900 shadow-lg shadow-blue-900/50 hover:bg-blue-500 transition-transform transform active:scale-95">
                    <i class="fa-solid fa-plus text-white text-2xl"></i>
                </a>
            </div>

            <a href="/transfer" class="flex flex-col items-center p-2 text-gray-400 hover:text-blue-400 active:text-blue-500 w-16">
                <i class="fa-solid fa-money-bill-transfer text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Transfer</span>
            </a>

            <a href="/profile" class="flex flex-col items-center p-2 text-gray-400 hover:text-blue-400 active:text-blue-500 w-16">
                <i class="fa-solid fa-user text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Profile</span>
            </a>

        </div>
    </div>

</body>
</html>
