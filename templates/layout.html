<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karan Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        /* Sidebar animations */
        #sidebar { transition: transform 0.3s ease-in-out; }
        .sidebar-open { transform: translateX(0); }
        .sidebar-closed { transform: translateX(-100%); }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">

    <!-- Header -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="text-white text-2xl focus:outline-none hover:text-blue-400 active:scale-95 transition">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h1 class="text-xl font-black text-white tracking-widest uppercase">KARAN <span class="text-blue-500">STORE</span></h1>
            </div>
            <div class="flex items-center gap-3">
                <a href="/deposit" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-full flex items-center gap-2 border border-gray-600 transition active:scale-95">
                    <i class="fa-solid fa-wallet text-green-400 text-sm"></i>
                    <span class="font-bold text-white text-sm">₹{{ balance }}</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Sidebar / Drawer -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-50 hidden backdrop-blur-sm transition-opacity"></div>
    <div id="sidebar" class="sidebar-closed fixed top-0 left-0 h-full w-72 bg-gray-800 border-r border-gray-700 z-50 shadow-2xl flex flex-col">
        <!-- Sidebar Header -->
        <div class="p-6 border-b border-gray-700 bg-gray-900 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-black text-white">KARAN <span class="text-blue-500">STORE</span></h2>
                <p class="text-xs text-gray-400 mt-1">User Panel</p>
            </div>
            <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <!-- Sidebar Links -->
        <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="/store" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white hover:bg-blue-600/20 hover:text-blue-400 transition font-medium">
                <i class="fa-solid fa-store w-5 text-center text-blue-500"></i> Product Store
            </a>
            <a href="/profile" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white hover:bg-blue-600/20 hover:text-blue-400 transition font-medium">
                <i class="fa-solid fa-user w-5 text-center text-purple-400"></i> My Profile
            </a>
            <a href="/deposit" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white hover:bg-blue-600/20 hover:text-blue-400 transition font-medium">
                <i class="fa-solid fa-money-bill-wave w-5 text-center text-green-500"></i> Add Balance
            </a>
            <a href="/history" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white hover:bg-blue-600/20 hover:text-blue-400 transition font-medium">
                <i class="fa-solid fa-box-open w-5 text-center text-yellow-500"></i> Order History
            </a>
            <a href="/deposit_history" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white hover:bg-blue-600/20 hover:text-blue-400 transition font-medium">
                <i class="fa-solid fa-clock-rotate-left w-5 text-center text-red-500"></i> Deposit History
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 cursor-not-allowed font-medium">
                <i class="fa-solid fa-gift w-5 text-center text-gray-500"></i> Referral <span class="text-[10px] bg-gray-700 px-2 py-0.5 rounded ml-auto">Soon</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white hover:bg-blue-600/20 hover:text-blue-400 transition font-medium">
                <i class="fa-solid fa-book w-5 text-center text-teal-400"></i> Tutorial
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white hover:bg-blue-600/20 hover:text-blue-400 transition font-medium">
                <i class="fa-solid fa-headset w-5 text-center text-orange-400"></i> Support
            </a>
            <a href="/transfer" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white hover:bg-blue-600/20 hover:text-blue-400 transition font-medium">
                <i class="fa-solid fa-money-bill-transfer w-5 text-center text-cyan-400"></i> Transfer Balance
            </a>
        </div>
        
        <div class="p-4 border-t border-gray-700">
            <a href="/logout" class="flex items-center justify-center gap-2 w-full bg-red-600/20 hover:bg-red-600/40 text-red-400 font-bold py-3 rounded-xl transition">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </a>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="max-w-4xl mx-auto p-4 relative">
        {% block content %}{% endblock %}
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        
        function toggleSidebar() {
            if (sidebar.classList.contains('sidebar-closed')) {
                sidebar.classList.remove('sidebar-closed');
                sidebar.classList.add('sidebar-open');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.remove('sidebar-open');
                sidebar.classList.add('sidebar-closed');
                overlay.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
