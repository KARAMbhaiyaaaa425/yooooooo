{% extends "layout.html" %}

{% block content %}
<div class="mb-6 flex items-center gap-3">
    <a href="/dashboard" class="text-white hover:text-gray-300"><i class="fa-solid fa-chevron-left"></i></a>
    <h2 class="text-lg font-bold text-white">Transfer Balance</h2>
</div>

{% if msg %}
<div class="bg-green-500/20 text-green-400 border border-green-500 p-4 rounded-xl mb-6 flex items-center gap-3">
    <i class="fa-solid fa-circle-check text-xl"></i>
    <p class="text-sm font-bold">{{ msg }}</p>
</div>
{% endif %}
{% if error %}
<div class="bg-red-500/20 text-red-400 border border-red-500 p-4 rounded-xl mb-6 flex items-center gap-3">
    <i class="fa-solid fa-circle-exclamation text-xl"></i>
    <p class="text-sm font-bold">{{ error }}</p>
</div>
{% endif %}

<div class="bg-card border border-gray-800 rounded-2xl p-5 mb-16">
    <div class="mb-6 pb-6 border-b border-gray-800 text-center">
        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">Your Current Balance</p>
        <p class="text-3xl font-bold text-white">₹{{ balance }}</p>
    </div>

    <form method="POST">
        <div class="mb-5">
            <label class="block text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-2">Recipient User ID</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-user text-gray-500"></i>
                </div>
                <input type="text" name="receiver_id" required class="block w-full pl-10 pr-3 py-4 bg-gray-900 border border-gray-700 rounded-xl text-white font-bold text-sm focus:outline-none focus:border-blue-500 transition" placeholder="e.g. 123456789">
            </div>
        </div>
        
        <div class="mb-6">
            <label class="block text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-2">Amount to Transfer</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <span class="text-gray-400 font-bold">₹</span>
                </div>
                <input type="number" name="amount" min="1" max="{{ balance }}" required class="block w-full pl-10 pr-3 py-4 bg-gray-900 border border-gray-700 rounded-xl text-white font-bold text-lg focus:outline-none focus:border-blue-500 transition" placeholder="100">
            </div>
        </div>
        
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.4)] transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> Send Money
        </button>
    </form>
</div>
{% endblock %}
