{% extends "layout.html" %}

{% block content %}
<div class="mb-6">
    <h2 class="text-2xl font-bold text-white">Transfer Balance</h2>
    <p class="text-gray-400 text-sm">Send funds to another user</p>
</div>

{% if msg %}
<div class="bg-gray-800 border-l-4 {% if 'Success' in msg %}border-green-500 text-green-400{% else %}border-red-500 text-red-400{% endif %} p-4 rounded-r-lg mb-6 shadow-md">
    {{ msg }}
</div>
{% endif %}

<div class="bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-700 relative overflow-hidden">
    <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10"></div>
    <form method="POST">
        <div class="mb-4">
            <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Target User ID</label>
            <input type="text" name="target_id" placeholder="Enter User ID" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
        </div>
        
        <div class="mb-6">
            <label class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wide">Amount (₹)</label>
            <input type="number" name="amount" min="1" max="{{ balance }}" placeholder="Min ₹1" required class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
        </div>
        
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-900/30 transition flex justify-center items-center gap-2 active:scale-95">
            <i class="fa-solid fa-paper-plane"></i> Send Funds
        </button>
    </form>
</div>
{% endblock %}
